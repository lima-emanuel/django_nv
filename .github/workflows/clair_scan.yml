name: Clair image scan

on:
  push:
    paths:
      - Dockerfile
      - requirements.txt
      - .github/workflows/clair-scan.yml
  pull_request:
    paths:
      - Dockerfile
      - requirements.txt
      - .github/workflows/clair-scan.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  clair-scan:
    runs-on: ubuntu-latest
    env:
      CLAIR_VERSION: v4.9.0
      IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Decide if we can push to GHCR
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]] && [[ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]]; then
            echo "can_push=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Clair scan: PR from fork cannot push to GHCR with GITHUB_TOKEN." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "can_push=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.guard.outputs.can_push == 'true'

      - name: Log in to GHCR
        if: steps.guard.outputs.can_push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image (from Dockerfile)
        if: steps.guard.outputs.can_push == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.IMAGE }}

      - name: Start Postgres + Clair (combo)
        if: steps.guard.outputs.can_push == 'true'
        shell: bash
        run: |
          set -euo pipefail

          docker network create clairnet

          docker run -d --name clairdb --network clairnet -p 5432:5432 \
            -e POSTGRES_USER=clair \
            -e POSTGRES_PASSWORD=clair \
            -e POSTGRES_DB=clair \
            postgres:16-alpine

          for i in {1..30}; do
            if docker exec clairdb pg_isready -U clair -d clair >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done

          cat > clair-config.yaml <<'YAML'
          http_listen_addr: ":6060"
          introspection_addr: ":6061"
          log_level: "info"
          indexer:
            connstring: "postgresql://clair:clair@clairdb:5432/clair?sslmode=disable"
            migrations: true
          matcher:
            connstring: "postgresql://clair:clair@clairdb:5432/clair?sslmode=disable"
            migrations: true
            disable_updaters: true
          notifier:
            connstring: "postgresql://clair:clair@clairdb:5432/clair?sslmode=disable"
            migrations: true
          YAML

          docker run -d --name clair --network clairnet -p 6060:6060 -p 6061:6061 \
            -v "$PWD/clair-config.yaml:/etc/clair/config.yaml:ro" \
            quay.io/projectquay/clair:4.9.0 \
              -conf /etc/clair/config.yaml -mode combo

          for i in {1..60}; do
            if curl -fsS "http://localhost:6061/readyz" >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          echo "Clair did not become ready in time" >&2
          docker logs clairdb | tail -n 200 || true
          docker logs clair | tail -n 200 || true
          exit 1

      - name: Download clairctl
        if: steps.guard.outputs.can_push == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o clairctl "https://github.com/quay/clair/releases/download/${CLAIR_VERSION}/clairctl-linux-amd64"
          chmod +x clairctl
          ./clairctl --version

      - name: Populate vulnerability database (export/import updaters)
        if: steps.guard.outputs.can_push == 'true'
        shell: bash
        run: |
          set -euo pipefail

          cat > clairctl-config.yaml <<'YAML'
          matcher:
            connstring: "postgresql://clair:clair@localhost:5432/clair?sslmode=disable"
          YAML

          ./clairctl -c clairctl-config.yaml export-updaters updates.json.gz
          ./clairctl -c clairctl-config.yaml import-updaters updates.json.gz

      - name: Run Clair report
        if: steps.guard.outputs.can_push == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ./clairctl report --host http://localhost:6060/ --out json "${IMAGE}" | tee clair-report.json

      - name: Fail on High/Critical
        if: steps.guard.outputs.can_push == 'true'
        shell: bash
        run: |
          set -euo pipefail
          count=$(jq '[..|objects|.severity? // empty] | map(ascii_downcase) | map(select(.=="high" or .=="critical")) | length' clair-report.json)
          echo "High/Critical findings: $count"
          test "$count" -eq 0

      - name: Upload report artifact
        if: steps.guard.outputs.can_push == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: clair-report
          path: clair-report.json
