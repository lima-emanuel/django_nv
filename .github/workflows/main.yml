name: Build and Lint

on:
    push:
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build-test:
        name: build-test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - name: "Set up Python"
              uses: actions/setup-python@v6
              with:
                  python-version: "3.13"
            - run: pip install -r requirements.txt
            - run: python manage.py check

    lint:
        name: lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: hadolint/hadolint-action@v3.3.0
              with:
                  dockerfile: Dockerfile
                  format: json
